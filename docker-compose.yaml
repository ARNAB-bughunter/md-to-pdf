version: '3.8'
 
services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    restart: always
  
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./nginx/favicon.ico:/usr/share/nginx/html/favicon.ico:ro
      - ./nginx/ads.txt:/usr/share/nginx/html/ads.txt:ro