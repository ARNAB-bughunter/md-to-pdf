worker_processes auto;
events {
    worker_connections 4096;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
    
    # ---- Rate Limiting Zones ----
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=strict:10m rate=1r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # ---- Performance ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # ---- SSL Hardening ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # ---- Security Headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    
    # ---- Gzip (SEO + Performance) ----
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    
    # ---- Backend ----
    upstream api_backend {
        server backend:5000;
        keepalive 32;
    }
    
    server {
        listen 80;
        server_name markdowntopdf.cloud www.markdowntopdf.cloud;
        
        # Block scanner bots even on HTTP
        location ~* /(wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php|wp-config|setup-config\.php) {
            return 444;  # Drop connection
        }
        
        return 301 https://$host$request_uri;
    }
    
    # ---- HTTPS Server ----
    server {
        listen 443 ssl;
        server_name markdowntopdf.cloud www.markdowntopdf.cloud;
        
        ssl_certificate /etc/letsencrypt/live/markdowntopdf.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/markdowntopdf.cloud/privkey.pem;
        
        # Connection limit: max 10 connections per IP
        limit_conn addr 10;
        
        # ---- Block WordPress/CMS Scanner Bots ----
        location ~* /(wp-admin|wp-includes|wp-content|wordpress|xmlrpc\.php|wp-config|setup-config\.php) {
            access_log /var/log/nginx/blocked.log;
            return 444;  # Close connection without response
        }
        
        # Block common exploit attempts
        location ~* \.(env|git|svn|htaccess|htpasswd)$ {
            return 444;
        }
        
        # Block suspicious query strings
        if ($query_string ~* "(\.\./|boot\.ini|etc/passwd|select.*from|union.*select)") {
            return 444;
        }
        
        # ---- robots.txt (served by Nginx, not FastAPI) ----
        location /robots.txt {
            root /usr/share/nginx/html;
            allow all;
            access_log off;
            log_not_found off;
        }
        
        location /ads.txt {
            root /usr/share/nginx/html;
            allow all;
            access_log off;
            log_not_found off;
        }
        
        # ---- Favicon ----
        location /favicon.ico {
            root /usr/share/nginx/html;
            allow all;
            access_log off;
            log_not_found off;
        }
       
        # ---- Main Application ----
        location / {
            # General rate limiting: 10 req/sec with burst of 20
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;
            
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}