worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ---- Performance ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ---- SSL Hardening ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;


    # ---- Security Headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ---- Gzip (SEO + Performance) ----
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    



    # ---- Backend ----
    upstream api_backend {
        server backend:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name markdowntopdf.cloud www.markdowntopdf.cloud;
        return 301 https://$host$request_uri;
    }

    # ---- HTTP Server ----
    server {
        listen 443 ssl;
        server_name markdowntopdf.cloud www.markdowntopdf.cloud;

        ssl_certificate /etc/letsencrypt/live/markdowntopdf.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/markdowntopdf.cloud/privkey.pem;

        # ---- robots.txt (served by Nginx, not FastAPI) ----
        location = /robots.txt {
            root /usr/share/nginx/html;
            allow all;
            access_log off;
            log_not_found off;
        }

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
